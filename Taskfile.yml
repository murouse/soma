version: '3'

vars:
  LOCAL_BIN:
    sh: echo '$(realpath)/bin'

tasks:
  tool:install:
    cmds:
      - GOBIN={{.LOCAL_BIN}} go install go.uber.org/mock/mockgen@v0.6.0
      - GOBIN={{.LOCAL_BIN}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0

  run:
    cmds:
      - go mod tidy
      - go run ./cmd

  test:
    cmds:
      - go test -race ./...

  lint:
    cmds:
      - PATH={{.LOCAL_BIN}}:{{.PATH}} golangci-lint run --config=.golangci.yml

  # Линтинг с исправлениями
  lint:fix:
    cmds:
      - PATH={{.LOCAL_BIN}}:{{.PATH}} golangci-lint run --fix --config=.golangci.yml

  gen:mock:
    cmds:
#      - cmd: find ./** -name 'mock_*' -exec rm {} \;
      - for: [ "." ]
        cmd: |
          find {{.ITEM}} -name '*.go' ! -path '*/mock/*' | while read -r f; do 
            if grep -q '^\s*//\s*go:build\s\+ignore' "$f"; then
              continue # Пропускаем файлы с тегом //go:build ignore
            fi
          
            if ! grep -q '^\s*type .* interface' "$f"; then
              continue # Пропускаем файлы, в которых нет интерфейсов
            fi
          
            base=$(basename "$f")
            mkdir -p "$(dirname "$f")/mock"
            PATH={{.LOCAL_BIN}}:{{.PATH}} mockgen -source="$f" -destination="$(dirname "$f")/mock/$base" -package=mock
          done
